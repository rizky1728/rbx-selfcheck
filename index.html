<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RBX Self-Check</title>
<style>
  :root {
    --bg: #0a0a0b;
    --card: #131316;
    --border: #26262b;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --dim: #6b7280;
    --amber: #f59e0b;
    --green: #22c55e;
    --red: #ef4444;
    --blue: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  h1 {
    font-size: 30px; font-weight: 800; letter-spacing: -.5px;
  }
  h1 span {
    background: linear-gradient(120deg, var(--amber), #fbbf24);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .sub {
    font-size: 12px; color: var(--muted); margin-top: 6px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 11px; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 8px;
    font-family: ui-monospace, monospace;
  }
  textarea {
    width: 100%;
    background: #0a0a0b;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: ui-monospace, monospace;
    font-size: 13px;
    padding: 12px;
    resize: vertical;
    min-height: 80px;
    outline: none;
    transition: border-color .2s;
  }
  textarea:focus { border-color: var(--amber); }
  button {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(180deg, #fbbf24, var(--amber));
    color: #0a0a0b;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .1s, box-shadow .2s;
    box-shadow: 0 4px 20px -4px rgba(228,161,27,.5);
  }
  button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px -4px rgba(228,161,27,.7);
  }
  button:disabled { opacity: .4; cursor: not-allowed; }

  .status {
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    min-height: 16px;
    font-family: ui-monospace, monospace;
  }
  .status.err { color: var(--red); }
  .status.ok { color: var(--green); }

  .out { display: none; }
  .out.show { display: block; }

  .section {
    margin-bottom: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .section h2 {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--amber);
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: rgba(245,158,11,.04);
    font-family: ui-monospace, monospace;
  }
  .section .body { padding: 8px 0; }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 18px;
    font-size: 13.5px;
    gap: 12px;
  }
  .row + .row { border-top: 1px solid rgba(255,255,255,.03); }
  .row .label { color: var(--muted); }
  .row .value { color: var(--text); font-weight: 500; text-align: right; word-break: break-word; }
  .row .value.green { color: var(--green); }
  .row .value.red { color: var(--red); }
  .row .value.yellow { color: var(--amber); }
  .row .value.blue { color: var(--blue); }
  .row .value.dim { color: var(--dim); font-weight: 400; }

  .itemlist { padding: 0; }
  .itemlist .item {
    display: flex;
    justify-content: space-between;
    padding: 9px 18px;
    font-size: 13px;
    border-top: 1px solid rgba(255,255,255,.03);
    gap: 10px;
  }
  .itemlist .item:first-child { border-top: none; }
  .itemlist .name { color: var(--text); }
  .itemlist .serial { color: var(--dim); font-size: 11px; margin-left: 6px; }
  .itemlist .price { color: var(--amber); font-weight: 600; white-space: nowrap; }

  .empty {
    padding: 14px 18px;
    color: var(--dim);
    font-size: 12.5px;
    font-style: italic;
  }

  footer {
    margin-top: 28px;
    text-align: center;
    font-size: 11px;
    color: var(--dim);
    font-family: ui-monospace, monospace;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>RBX <span>Self-Check</span></h1>
    <p class="sub">// cookie nggak keluar dari mesin ini · 127.0.0.1 only</p>
  </header>

  <div class="card">
    <label for="cookie">.ROBLOSECURITY</label>
    <textarea id="cookie" placeholder="Paste cookie di sini..."></textarea>
    <button id="go">Check</button>
    <div class="status" id="status"></div>
  </div>

  <div class="out" id="out">
    <div class="section">
      <h2>Identity</h2>
      <div class="body" id="s-identity"></div>
    </div>

    <div class="section">
      <h2>Economy</h2>
      <div class="body" id="s-economy"></div>
    </div>

    <div class="section">
      <h2>Collectibles / Limited</h2>
      <div class="body" id="s-collectibles"></div>
    </div>

    <div class="section">
      <h2>Security</h2>
      <div class="body" id="s-security"></div>
    </div>

    <div class="section">
      <h2>Social</h2>
      <div class="body" id="s-social"></div>
    </div>

    <div class="section">
      <h2>Groups</h2>
      <div class="body" id="s-groups"></div>
    </div>

    <div class="section">
      <h2>Recently Played</h2>
      <div class="body" id="s-recent"></div>
    </div>

    <div class="section">
      <h2>Badges</h2>
      <div class="body" id="s-badges"></div>
    </div>
  </div>

  <footer>rbx-selfcheck · local only</footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n || 0).toLocaleString("id-ID");

function row(label, value, cls = "") {
  const div = document.createElement("div");
  div.className = "row";
  div.innerHTML = `<span class="label">${label}</span>
                   <span class="value ${cls}">${value}</span>`;
  return div;
}

function empty(msg) {
  const d = document.createElement("div");
  d.className = "empty";
  d.textContent = msg;
  return d;
}

function fill(id, children) {
  const el = $(id);
  el.innerHTML = "";
  children.forEach(c => el.appendChild(c));
}

async function run() {
  const btn = $("go");
  const status = $("status");
  const cookie = $("cookie").value.trim();

  if (!cookie) {
    status.className = "status err";
    status.textContent = "[!] Cookie kosong.";
    return;
  }

  btn.disabled = true;
  status.className = "status";
  status.textContent = "[*] Checking...";
  $("out").classList.remove("show");

  try {
    const r = await fetch("/api/check", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cookie })
    });
    const data = await r.json();

    if (!r.ok) {
      status.className = "status err";
      status.textContent = "[!] " + (data.error || "Unknown error");
      btn.disabled = false;
      return;
    }

    // Identity
    fill("s-identity", [
      row("Username", "@" + data.identity.username, "blue"),
      row("Display", data.identity.display, "blue"),
      row("User ID", data.identity.uid),
      row("Created", `${data.identity.created.slice(0,10)}  (${fmt(data.identity.age_days)} hari)`),
      row("Description", data.identity.description || "—", "dim")
    ]);

    // Economy
    fill("s-economy", [
      row("Robux", fmt(data.economy.robux), "green"),
      row("Premium", data.premium ? "YES" : "NO", data.premium ? "green" : "dim")
    ]);

    // Collectibles
    const col = data.collectibles;
    const colNodes = [
      row("Total items", fmt(col.count), "green"),
      row("RAP", "R$ " + fmt(col.rap), "green")
    ];
    if (col.items.length) {
      const wrap = document.createElement("div");
      wrap.className = "itemlist";
      col.items.forEach(it => {
        const d = document.createElement("div");
        d.className = "item";
        const serial = it.serial ? `<span class="serial">#${it.serial}</span>` : "";
        d.innerHTML = `<span class="name">${it.name}${serial}</span>
                       <span class="price">R$ ${fmt(it.price)}</span>`;
        wrap.appendChild(d);
      });
      colNodes.push(wrap);
    } else {
      colNodes.push(empty("Nggak ada limited."));
    }
    fill("s-collectibles", colNodes);

    // Security
    fill("s-security", [
      row("2FA", data.security.twofa_enabled ? "ENABLED" : "DISABLED",
          data.security.twofa_enabled ? "green" : "red"),
      row("Methods", data.security.twofa_methods.join(", ") || "—",
          data.security.twofa_methods.length ? "" : "dim")
    ]);

    // Social
    fill("s-social", [
      row("Friends", fmt(data.social.friends)),
      row("Followers", fmt(data.social.followers)),
      row("Following", fmt(data.social.following))
    ]);

    // Groups
    const gNodes = [row("Total", fmt(data.groups.length))];
    if (data.groups.length) {
      const wrap = document.createElement("div");
      wrap.className = "itemlist";
      data.groups.forEach(g => {
        const d = document.createElement("div");
        d.className = "item";
        d.innerHTML = `<span class="name">${g.name}</span>
                       <span class="price" style="color:var(--dim);font-weight:400">${g.role}</span>`;
        wrap.appendChild(d);
      });
      gNodes.push(wrap);
    } else {
      gNodes.push(empty("Nggak ada grup."));
    }
    fill("s-groups", gNodes);

    // Recent
    if (data.recent.length) {
      const wrap = document.createElement("div");
      wrap.className = "itemlist";
      data.recent.forEach(g => {
        const d = document.createElement("div");
        d.className = "item";
        d.innerHTML = `<span class="name">${g.name}</span>
                       <span class="price" style="color:var(--dim);font-weight:400">place:${g.place || "?"}</span>`;
        wrap.appendChild(d);
      });
      fill("s-recent", [wrap]);
    } else {
      fill("s-recent", [empty("Kosong / private.")]);
    }

    // Badges
    if (data.badges.length) {
      const wrap = document.createElement("div");
      wrap.className = "itemlist";
      data.badges.slice(0, 30).forEach(b => {
        const d = document.createElement("div");
        d.className = "item";
        d.innerHTML = `<span class="name">${b.name}</span>`;
        wrap.appendChild(d);
      });
      if (data.badges.length > 30) {
        wrap.appendChild(empty(`… +${data.badges.length - 30} more`));
      }
      fill("s-badges", [wrap]);
    } else {
      fill("s-badges", [empty("Nggak ada badge.")]);
    }

    $("out").classList.add("show");
    status.className = "status ok";
    status.textContent = "[+] OK.";
  } catch (e) {
    status.className = "status err";
    status.textContent = "[!] " + e.message;
  } finally {
    btn.disabled = false;
  }
}

$("go").addEventListener("click", run);
$("cookie").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) run();
});
</script>
</body>
</html>
